#AMARISOFT MONITORING FRAMEWORK CONFIGURATION
#Controls network node connections, Prometheus exporter, and logging levels.

[Amari]
Callbox=YOUR_IP_ADDRESS
MME=9000
ENB=9001
# Maximum number of requests before connection reset
request_limit=20
# Time interval (seconds) between requests
request_interval=5

[CORE]
IP=YOUR_IP_ADDRESS
MME=9000
ENB=9001
request_limit=20
request_interval=5

[FIUM_T3]
IP=YOUR_IP_ADDRESS
MME=9000
ENB=9001
request_limit=20
request_interval=5

[PCI_503]
IP=YOUR_IP_ADDRESS
MME=9000
ENB=9001
request_limit=20
request_interval=5

[Prometheus]
port=8082

[debug]
maxLevel=DEBUG
mode=ERROR
filemode=INFO
file=stats.log
version=1.0
